version: 2
updates:
  # npm dependencies (pnpm). Grouped to reduce PR noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Only propose versions that have been published a while — clears pnpm's
    # minimumReleaseAge supply-chain check that runs in CI.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Review major bumps manually rather than auto-grouping them.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
