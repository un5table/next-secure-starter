name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # allow manual runs (e.g. to run the opt-in E2E job on demand)

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          # Dummy values so the build doesn't fail on missing env. No DB is hit at build time.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=require"
          AUTH_SECRET: "ci-dummy-secret-must-be-at-least-32-chars-long"
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # Self-contained: runs against a throwaway Postgres service container, so it
    # needs no external accounts, secrets, or opt-in flags — it runs on every push
    # and PR (including Dependabot). The app selects the node-postgres driver
    # adapter automatically for non-Neon URLs (see src/lib/prisma.ts). To test
    # against real Neon instead, use the opt-in `.github/workflows/e2e-neon.yml`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/app_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Push schema + seed
        # The template ships no migrations (you own your history), so we push the
        # schema directly to the fresh container. Swap to `prisma migrate deploy`
        # once you have committed migrations.
        run: |
          pnpm db:generate
          npx prisma db push
          pnpm db:seed

      - name: Run E2E tests
        env:
          AUTH_SECRET: "ci-e2e-dummy-secret-must-be-at-least-32-chars-xx"
          DEV_PASSWORD: "dev"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
