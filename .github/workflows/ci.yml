name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # allow manual runs (e.g. to run the opt-in E2E job on demand)

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          # Dummy values so the build doesn't fail on missing env. No DB is hit at build time.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=require"
          AUTH_SECRET: "ci-dummy-secret-must-be-at-least-32-chars-long"
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # Opt-in: set repository variable ENABLE_E2E=true and provide Neon secrets.
    if: ${{ vars.ENABLE_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create Neon test branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Push schema + seed
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        # The template ships no migrations (you own your history). For the ephemeral
        # test branch we push the schema directly. Swap to `prisma migrate deploy`
        # once you have committed migrations.
        run: |
          pnpm db:generate
          npx prisma db push
          pnpm db:seed

      - name: Run E2E tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          AUTH_SECRET: "ci-e2e-dummy-secret-must-be-at-least-32-chars-xx"
          DEV_PASSWORD: "dev"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon test branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
