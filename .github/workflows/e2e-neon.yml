name: E2E (real Neon)

# Opt-in alternative to the default service-container E2E in ci.yml. Runs the same
# Playwright suite against an ephemeral branch of a real Neon project, so you can
# verify Neon-specific behavior (pooler, serverless driver). It is manual-only and
# self-skips unless you have configured it:
#
#   1. Create your own Neon project and a project-scoped API key.
#   2. Repo secrets:   NEON_PROJECT_ID, NEON_API_KEY   (see scripts/setup-neon.mjs)
#   3. Repo variable:  ENABLE_NEON_E2E = true
#
# Secrets are NOT inherited when this repo is used as a template — each user wires
# their own, so nothing Neon-specific is baked in.

on:
  workflow_dispatch:

jobs:
  e2e-neon:
    name: E2E against Neon branch
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_NEON_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create Neon test branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Push schema + seed
        env:
          # v6 of create-branch-action exposes db_url_pooled (pooled) and db_url (direct).
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm db:generate
          npx prisma db push --force-reset
          pnpm db:seed

      - name: Run E2E tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          AUTH_SECRET: "ci-e2e-dummy-secret-must-be-at-least-32-chars-xx"
          DEV_PASSWORD: "dev"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-neon-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon test branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
