name: CodeQL

# Static security analysis for JS/TS. Results appear under the repo's Security
# → Code scanning tab. Advanced setup (this committed workflow) is used instead
# of GitHub's default setup so the configuration is visible and customizable.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:javascript-typescript"
