# Force the patched path-to-regexp under @vercel/config (ReDoS GHSA-9wv6-86v2-598j).
overrides:
  "@vercel/routing-utils>path-to-regexp": "^6.3.0"

allowBuilds:
  argon2: true
  sharp: true
  unrs-resolver: true
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  msw: true
  simple-git-hooks: true
  # Only needed to download the sentry-cli binary for source-map upload (opt-in).
  # Flip to true if you set SENTRY_AUTH_TOKEN and want uploaded source maps.
  "@sentry/cli": false
